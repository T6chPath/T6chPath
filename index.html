const quizContainer = document.querySelector(".quiz-container");
const resultContainer = document.querySelector(".quiz-result");
const timerDisplay = document.querySelector(".quiz-container .timer");
const questionEl = document.querySelector(".quiz-container .question");
const optionsEl = document.querySelector(".quiz-container .options");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");
const fibRow = document.getElementById("fibRow");
const fibInput = document.getElementById("fibInput");
const fibSubmit = document.getElementById("fibSubmit");

const MAX_QUESTIONS = QUESTIONS.length;
const SECONDS_PER_QUESTION = 25;
const TEST_DURATION = MAX_QUESTIONS * SECONDS_PER_QUESTION;

let active = [];
let questionNumber = 0;
let score = 0;
let timeLeft = 0;
let timerInterval;

const shuffleArray = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
};

const resetLocalStorage = () => {
    for (let i = 0; i < MAX_QUESTIONS; i++) {
        localStorage.removeItem(`userAnswer_${i}`);
    }
};

function correctText(q) {
    if (q.type === "mc") {
        const o = q.opts.find(x => x.l === q.ans);
        return o ? o.t : q.anst;
    }
    if (q.type === "tf") return q.ans;
    return q.anst;
}

function fibMatch(input, ans) {
    const ni = norm(input);
    if (!ni) return false;
    const candidates = [ans, ans.replace(/\([^)]*\)/g, "").trim()];
    ans.split(/[;,]/).forEach(p => {
        const t = p.trim().replace(/\([^)]*\)/g, "").trim();
        if (t) candidates.push(t);
    });
    return candidates.some(c => c && norm(c) === ni);
}
function norm(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
}

function isCorrect(q, userText) {
    if (!userText) return false;
    const t = String(userText).trim();
    if (q.type === "fib") return fibMatch(t, q.anst);
    return t === correctText(q);
}

const formatTime = seconds => {
    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
};

const updateTimerDisplay = () => {
    timerDisplay.textContent = `Time Left: ${formatTime(timeLeft)}`;
    timerDisplay.classList.toggle("danger", timeLeft <= 300);
};

const startTestTimer = () => {
    clearInterval(timerInterval);
    timeLeft = TEST_DURATION;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
            timeLeft = 0;
            updateTimerDisplay();
            clearInterval(timerInterval);
            displayQuizResult();
            return;
        }
        updateTimerDisplay();
    }, 1000);
};

function checkAnswer(userAnswer, el) {
    const q = active[questionNumber];
    const correct = correctText(q);
    const ok = isCorrect(q, userAnswer);

    if (ok) {
        score++;
        el.classList.add("correct");
        celebrateAnswer(el);
    } else {
        el.classList.add("incorrect");
    }

    localStorage.setItem(`userAnswer_${questionNumber}`, String(userAnswer).trim());

    const allOptions = document.querySelectorAll(".quiz-container .option");
    allOptions.forEach(o => o.classList.add("disabled"));
    fibInput.disabled = true;
    fibSubmit.disabled = true;

    if (!ok) {
        allOptions.forEach(o => {
            if (o.textContent.trim() === correct) o.classList.add("correct");
        });
    }
}

function celebrateAnswer(el) {
    if (!el || el.tagName === "INPUT") return;

    const badge = document.createElement("span");
    badge.className = "celebrate";
    badge.innerHTML = 'AWESOME <span class="cracker-emoji">🎉</span>';
    el.appendChild(badge);

    const crackers = document.createElement("span");
    crackers.className = "crackers";
    crackers.textContent = "🎆 🎇 ✨";
    el.appendChild(crackers);

    const emojis = ["🎉", "🎊", "🎆", "🎇", "✨", "💥"];
    for (let i = 0; i < 18; i++) {
        const c = document.createElement("span");
        c.className = "confetti";
        c.textContent = emojis[i % emojis.length];
        c.style.left = Math.random() * 100 + "vw";
        c.style.animationDuration = (1.4 + Math.random() * 1.6) + "s";
        c.style.fontSize = (14 + Math.random() * 18) + "px";
        c.style.animationDelay = (Math.random() * 0.5) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3500);
    }
}

function buildOptions(q, savedUser) {
    optionsEl.innerHTML = "";
    fibRow.classList.add("hidden");
    optionsEl.classList.remove("hidden");

    const correct = correctText(q);
    const locked = savedUser != null;
    const qs = q.type === "tf" ? ["True", "False"] : q.opts.map(o => o.t);

    qs.forEach(o => {
        const option = document.createElement("button");
        option.classList.add("option");
        option.textContent = o;
        if (locked) {
            option.classList.add("disabled");
            if (o === correct) option.classList.add("correct");
            if (o === String(savedUser).trim() && o !== correct) option.classList.add("incorrect");
        } else {
            option.addEventListener("click", () => checkAnswer(o, option));
        }
        optionsEl.appendChild(option);
    });
}

function buildFib(q, savedUser) {
    optionsEl.classList.add("hidden");
    fibRow.classList.remove("hidden");
    fibInput.classList.remove("correct", "incorrect");
    fibInput.value = savedUser != null ? savedUser : "";

    if (savedUser != null) {
        fibInput.disabled = true;
        fibSubmit.disabled = true;
        fibInput.classList.add(isCorrect(q, savedUser) ? "correct" : "incorrect");
    } else {
        fibInput.disabled = false;
        fibSubmit.disabled = false;
        fibInput.focus();
    }
}

function createQuestion() {
    optionsEl.innerHTML = "";
    const q = active[questionNumber];
    const savedUser = localStorage.getItem(`userAnswer_${questionNumber}`);
    const tq = q.t.replace(/^True\/False:\s*/, "");
    questionEl.innerHTML = `<span class="question-number">${questionNumber + 1}/${MAX_QUESTIONS}</span> ${tq}`;

    if (q.type === "fib") {
        buildFib(q, savedUser);
    } else {
        buildOptions(q, savedUser);
    }

    nextBtn.textContent = questionNumber >= MAX_QUESTIONS - 1 ? "Finish" : "Next";
    prevBtn.disabled = questionNumber === 0;
}

fibSubmit.addEventListener("click", () => {
    if (!fibInput.disabled) {
        const val = fibInput.value.trim();
        if (!val) { fibInput.focus(); return; }
        checkAnswer(val, fibInput);
        if (isCorrect(active[questionNumber], val)) fibInput.classList.add("correct");
        else fibInput.classList.add("incorrect");
    }
});
fibInput.addEventListener("keydown", e => {
    if (e.key === "Enter") fibSubmit.click();
});

const displayNextQuestion = () => {
    if (questionNumber >= MAX_QUESTIONS - 1) {
        displayQuizResult();
        return;
    }
    questionNumber++;
    createQuestion();
};
nextBtn.addEventListener("click", displayNextQuestion);

const displayPrevQuestion = () => {
    if (questionNumber > 0) {
        questionNumber--;
        createQuestion();
    }
};
prevBtn.addEventListener("click", displayPrevQuestion);

const getResultMessage = () => {
    const pct = score / MAX_QUESTIONS;
    if (pct === 1) return "Outstanding! Perfect score.";
    if (pct >= 0.75) return "Very good.";
    if (pct >= 0.5) return "Good. Keep practising the weak spots.";
    if (pct >= 0.25) return "Do hard work — revisit the review list below.";
    return "Better luck next time.";
};

const displayQuizResult = () => {
    clearInterval(timerInterval);
    resultContainer.style.display = "flex";
    quizContainer.style.display = "none";
    resultContainer.innerHTML = "";

    const heading = document.createElement("h2");
    heading.innerHTML = `You have scored ${score} out of ${MAX_QUESTIONS}.`;
    resultContainer.appendChild(heading);

    const msg = document.createElement("h3");
    msg.innerHTML = getResultMessage();
    resultContainer.appendChild(msg);

    const legend = document.createElement("div");
    legend.className = "result-legend";
    legend.innerHTML = '<span><span class="dot g"></span> Correct</span><span><span class="dot r"></span> Wrong</span><span><span class="dot w"></span> Not answered</span>';
    resultContainer.appendChild(legend);

    for (let i = 0; i < MAX_QUESTIONS; i++) {
        const q = active[i];
        const userAnswer = localStorage.getItem(`userAnswer_${i}`);
        const attempted = !!(userAnswer && userAnswer.trim());
        const ok = isCorrect(q, userAnswer);

        const item = document.createElement("div");
        item.classList.add("question-container");
        if (ok) item.classList.add("correct-item");
        else if (attempted) item.classList.add("incorrect-item");

        const showQ = q.t.replace(/^True\/False:\s*/, "");
        const userText = attempted ? userAnswer.trim() : "Not answered";
        const ansClass = ok ? "good" : (attempted ? "bad" : "muted");
        const ansLine = `<div class="correct-answer">Correct answer: ${correctText(q)}</div>`;

        item.innerHTML = `
            <div class="question"><span class="qno">Q${q.n}</span>${showQ}</div>
            <div class="user-answer ${ansClass}">Your answer: ${userText}</div>
            ${ansLine}`;

        resultContainer.appendChild(item);
    }

    const retakeBtn = document.createElement("button");
    retakeBtn.classList.add("retake-btn");
    retakeBtn.innerHTML = "Retake Quiz";
    retakeBtn.addEventListener("click", retakeQuiz);
    resultContainer.appendChild(retakeBtn);

    window.scrollTo({ top: 0 });
};

const retakeQuiz = () => {
    questionNumber = 0;
    score = 0;
    active = shuffleArray(active);
    resetLocalStorage();

    startTestTimer();
    createQuestion();
    resultContainer.style.display = "none";
    quizContainer.style.display = "block";
    window.scrollTo({ top: 0 });
};

active = shuffleArray(QUESTIONS);
resetLocalStorage();
startTestTimer();
createQuestion();
</script>
